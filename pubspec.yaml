name: scrabble_companion
description: Offline-first Scrabble companion - timer, word checker, and score keeper.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  audio_session: ^0.2.4
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  just_audio: ^0.10.6
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0+eol
  url_launcher: ^6.3.2
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/sound1.mp3
    - assets/branding/logo.png
    - assets/dictionaries/nwl2023.txt
    - assets/dictionaries/csw21.txt
    - assets/dictionaries/ospd-defs.txt
